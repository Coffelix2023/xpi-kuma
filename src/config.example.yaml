# xpi-kuma 配置示例
#
# 用法：实际生效的是全局配置 `~/.pi/agent/data/xpi-kuma/config.yaml`（缺文件时首次运行自动生成模板）。
# 密钥请使用 ${ENV_VAR} 占位符，不要直接写明文。

vendors:
  - name: "OpenAI"
    endpoint: "https://api.openai.com/v1"
    models: ["gpt-4o-mini"]
    api_key: "${OPENAI_API_KEY}"
    probe:
      enabled: true
      interval: "5m"
      timeout: 30000

    # 余额取数（可选）。三档降级：余额接口 → OAuth 授权 → 手动填写；段缺失即视为
    # 未配置，面板不会替你去猜任何接口路径。
    # 探测结论：本样例的四家供应商目前都没有可用的公开余额接口
    # （见 docs/probe-balance-and-oauth.md），所以这里只留注释样例。
    # balance:
    #   api_path: "/path/to/balance"   # 相对 endpoint；以 http 开头则按绝对地址请求
    #   manual: 42.6                   # 手动填写的当前余额（第三档）
    #   topup: 200                     # 累计充值
    # oauth:                           # 四项齐全才生效
    #   authorize_url: "https://example.com/oauth/authorize"
    #   token_url: "https://example.com/oauth/token"
    #   client_id: "your-client-id"
    #   scopes: ["balance:read"]

  - name: "Anthropic"
    endpoint: "https://api.anthropic.com/v1"
    models: ["claude-3-5-haiku-latest"]
    api_key: "${ANTHROPIC_API_KEY}"
    probe:
      enabled: true
      interval: "1h"
      timeout: 30000

  - name: "9router"
    endpoint: "https://api.9router.example/v1"
    models: ["gpt-4o-mini"]
    api_key: "${NINE_ROUTER_API_KEY}"
    probe:
      # 中转站限流较严时建议关闭探测
      enabled: false
      interval: "10m"
      timeout: 30000

  - name: "commandcode"
    endpoint: "https://api.commandcode.ai/provider/v1"
    # 占位：公开仓库不披露默认 model，按你的订阅填写；同一供应商可配多个模型
    models: ["<your-commandcode-model>"]
    api_key: "${COMMANDCODE_API_KEY}"
    probe:
      enabled: true
      interval: "5m"
      timeout: 30000

retention:
  # 原始使用量记录保留天数，超期记录在会话启动时清理
  raw_records: 7
